<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WuXiangYu - Time Motion Archive V6</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4ead9;
      --soft: rgba(244, 234, 217, .72);
      --muted: rgba(244, 234, 217, .48);
      --quiet: rgba(244, 234, 217, .22);
      --hair: rgba(244, 234, 217, .16);
      --bg: #030303;
      --accent: #c98a44;
      --accent2: #75654a;
      --mx: .5;
      --my: .5;
      --drag-x: 0px;
      --drag-y: 0px;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --title-font: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
      --ui-font: "Inter", "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--ui-font);
      cursor: none;
    }

    button,
    label {
      border: 0;
      padding: 0;
      color: inherit;
      font: inherit;
      background: transparent;
      cursor: none;
    }

    .page {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 780px;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at calc(var(--mx) * 100%) calc(var(--my) * 100%), color-mix(in srgb, var(--accent) 25%, transparent), transparent 26%),
        linear-gradient(120deg, #020202, color-mix(in srgb, var(--accent2) 13%, #060606) 44%, #020303);
    }

    .atmosphere {
      position: absolute;
      inset: -10%;
      z-index: -8;
      pointer-events: none;
      opacity: .4;
      transform: translate3d(calc((var(--mx) - .5) * -30px), calc((var(--my) - .5) * -20px), 0) scale(1.08);
      background:
        radial-gradient(circle at 58% 44%, color-mix(in srgb, var(--accent) 48%, transparent), transparent 24%),
        radial-gradient(circle at 24% 72%, color-mix(in srgb, var(--accent2) 44%, transparent), transparent 30%);
      filter: blur(24px) saturate(1.12);
    }

    .atmosphere.has-image {
      background-image: var(--bg-img);
      background-size: cover;
      background-position: center;
      opacity: .34;
    }

    .time-field {
      position: absolute;
      inset: -20%;
      z-index: -7;
      pointer-events: none;
      opacity: .5;
      transform: translate3d(calc((var(--mx) - .5) * -18px), calc((var(--my) - .5) * -14px), 0);
    }

    .time-field::before,
    .time-field::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 60% 48%, transparent 0 18%, rgba(244,234,217,.08) 18.2% 18.35%, transparent 18.6% 30%, rgba(244,234,217,.06) 30.2% 30.35%, transparent 30.6%),
        repeating-conic-gradient(from 18deg at 60% 48%, transparent 0deg 16deg, rgba(244,234,217,.055) 16.2deg 16.7deg, transparent 17deg 24deg);
      animation: rotateField 28s linear infinite;
    }

    .time-field::after {
      opacity: .42;
      transform: scale(1.34) rotate(8deg);
      animation-duration: 44s;
      animation-direction: reverse;
    }

    @keyframes rotateField {
      to { transform: rotate(360deg); }
    }

    .veil {
      position: absolute;
      inset: 0;
      z-index: -4;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0,0,0,.74), rgba(0,0,0,.22) 25%, transparent 52%, rgba(0,0,0,.66)),
        linear-gradient(0deg, rgba(0,0,0,.82), transparent 22%, transparent 76%, rgba(0,0,0,.64));
    }

    .grain {
      position: absolute;
      inset: -25%;
      z-index: 20;
      pointer-events: none;
      opacity: .085;
      mix-blend-mode: screen;
      background-image:
        radial-gradient(circle at 18% 30%, white 0 1px, transparent 1.2px),
        radial-gradient(circle at 72% 64%, white 0 1px, transparent 1.2px),
        radial-gradient(circle at 44% 82%, white 0 1px, transparent 1.2px);
      background-size: 71px 59px, 101px 83px, 47px 41px;
      animation: grain 1.3s steps(4) infinite;
    }

    @keyframes grain {
      0% { transform: translate3d(0,0,0); }
      25% { transform: translate3d(1.1%,-.7%,0); }
      50% { transform: translate3d(-.8%,1.1%,0); }
      75% { transform: translate3d(.5%,.6%,0); }
      100% { transform: translate3d(0,0,0); }
    }

    .shell {
      position: relative;
      z-index: 2;
      height: 100%;
      display: grid;
      grid-template-columns: minmax(210px, 16vw) minmax(0, 1fr);
      grid-template-rows: 74px minmax(0, 1fr) 130px;
      gap: 22px 32px;
      padding: 28px 34px 30px;
      perspective: 1500px;
    }

    .topbar {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 20px;
      pointer-events: none;
    }

    .touch {
      pointer-events: auto;
      transition: color .22s ease, opacity .22s ease, transform .28s cubic-bezier(.16, 1, .3, 1), text-shadow .22s ease;
    }

    .touch:hover {
      color: #fff;
      transform: translateY(-2px);
      text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 36%, transparent);
    }

    .brand {
      width: max-content;
      text-align: left;
    }

    .brand-title {
      display: block;
      font-family: var(--title-font);
      font-size: 23px;
      line-height: 1;
      font-weight: 500;
    }

    .micro,
    .status,
    .nav-meta,
    .image-label,
    .work-en,
    .work-index,
    .keyword,
    .tab,
    .route-button {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.5;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .micro {
      display: block;
      margin-top: 10px;
    }

    .status {
      justify-self: center;
      width: min(520px, 42vw);
      text-align: left;
    }

    .status-line {
      position: relative;
      display: block;
      height: 1px;
      margin-top: 10px;
      overflow: hidden;
      background: rgba(244,234,217,.12);
    }

    .status-line::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: calc(var(--mx) * 100%);
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent2));
      box-shadow: 0 0 20px var(--accent);
    }

    .tools {
      justify-self: end;
      display: flex;
      gap: 9px;
      pointer-events: auto;
    }

    .tool {
      min-width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--hair);
      background: rgba(0,0,0,.18);
      color: var(--soft);
      backdrop-filter: blur(12px);
    }

    .tool:hover {
      border-color: rgba(244,234,217,.56);
      background: rgba(244,234,217,.07);
    }

    .file { display: none; }

    .side {
      grid-column: 1;
      grid-row: 2;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 0;
      padding-top: 8px;
    }

    .work-list {
      align-self: center;
      display: grid;
      gap: 8px;
      pointer-events: auto;
    }

    .work-button {
      position: relative;
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 12px;
      align-items: baseline;
      width: 100%;
      padding: 8px 0;
      text-align: left;
      color: rgba(244,234,217,.42);
      transition: color .25s ease, transform .3s cubic-bezier(.16, 1, .3, 1);
    }

    .work-button::after {
      content: "";
      position: absolute;
      left: 40px;
      right: 0;
      bottom: 2px;
      height: 1px;
      transform: scaleX(0);
      transform-origin: left;
      background: linear-gradient(90deg, var(--accent), transparent);
      transition: transform .34s cubic-bezier(.16, 1, .3, 1);
    }

    .work-button:hover,
    .work-button.is-active {
      color: var(--ink);
      transform: translateX(7px);
    }

    .work-button:hover::after,
    .work-button.is-active::after {
      transform: scaleX(1);
    }

    .work-title {
      display: block;
      font-family: var(--title-font);
      font-size: clamp(17px, 1.5vw, 26px);
      line-height: 1.05;
      font-weight: 500;
    }

    .glyph {
      display: inline-block;
      will-change: transform;
      transition: transform .28s cubic-bezier(.16, 1, .3, 1), color .18s ease, opacity .18s ease;
    }

    .side-footer {
      display: grid;
      gap: 8px;
      padding-bottom: 4px;
    }

    .route-button {
      width: max-content;
      transition: color .2s ease, transform .22s ease;
    }

    .route-button:hover {
      color: var(--ink);
      transform: translateX(5px);
    }

    .stage {
      grid-column: 2;
      grid-row: 2;
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    .hero {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 28%);
      gap: 28px;
      align-items: end;
    }

    .projection {
      position: relative;
      align-self: stretch;
      min-height: 0;
      transform:
        translate3d(calc(var(--drag-x) + (var(--mx) - .5) * 18px), calc(var(--drag-y) + (var(--my) - .5) * 12px), 0)
        rotateX(var(--tilt-x))
        rotateY(var(--tilt-y));
      transform-style: preserve-3d;
      will-change: transform;
      touch-action: none;
    }

    .projection-shell {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 1px solid rgba(244,234,217,.16);
      background: #090807;
      box-shadow: 0 45px 130px rgba(0,0,0,.6);
      clip-path: inset(1.4% 1.4% 1.4% 1.4%);
      transition: clip-path .48s cubic-bezier(.16, 1, .3, 1), border-color .22s ease, filter .28s ease;
    }

    .projection:hover .projection-shell,
    .projection.is-open .projection-shell {
      clip-path: inset(0);
      border-color: rgba(244,234,217,.45);
      filter: saturate(1.05);
    }

    .main-image {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--fallback);
    }

    .main-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.035);
      transition: transform .7s cubic-bezier(.16, 1, .3, 1), filter .35s ease;
    }

    .projection:hover .main-image img,
    .projection.is-open .main-image img {
      transform: scale(1.07) translate3d(calc((var(--mx) - .5) * -15px), calc((var(--my) - .5) * -10px), 0);
      filter: brightness(1.04) saturate(1.06);
    }

    .main-image::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(circle at calc(var(--mx) * 100%) calc(var(--my) * 100%), transparent 0 18%, rgba(0,0,0,.2) 54%, rgba(0,0,0,.72)),
        linear-gradient(0deg, rgba(0,0,0,.55), transparent 34%);
    }

    .projection.is-switching .main-image::after,
    .projection.is-open .main-image::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent, rgba(255,255,255,.32), transparent),
        repeating-linear-gradient(90deg, transparent 0 16px, rgba(255,255,255,.055) 17px, transparent 18px);
      animation: scan .76s cubic-bezier(.16, 1, .3, 1);
    }

    @keyframes scan {
      from { transform: translateX(-100%); opacity: 0; filter: blur(7px); }
      25% { opacity: .85; }
      to { transform: translateX(100%); opacity: 0; filter: blur(0); }
    }

    .image-label {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 15px;
      z-index: 4;
      display: flex;
      justify-content: space-between;
      gap: 18px;
      pointer-events: none;
      text-shadow: 0 3px 16px rgba(0,0,0,.85);
    }

    .float-panel {
      position: absolute;
      z-index: 5;
      overflow: hidden;
      border: 1px solid rgba(244,234,217,.13);
      background: rgba(0,0,0,.28);
      box-shadow: 0 22px 60px rgba(0,0,0,.36);
      backdrop-filter: blur(4px);
      pointer-events: none;
      opacity: .62;
      transform-style: preserve-3d;
      animation: floatPanel 7s ease-in-out infinite;
    }

    .float-panel.a {
      width: 18%;
      aspect-ratio: 16 / 10;
      right: 5%;
      top: 8%;
      animation-delay: -.8s;
    }

    .float-panel.b {
      width: 14%;
      aspect-ratio: 9 / 12;
      left: 4%;
      bottom: 8%;
      animation-delay: -3s;
    }

    @keyframes floatPanel {
      0%, 100% { transform: translate3d(0, 0, 70px) rotateZ(-1deg); }
      50% { transform: translate3d(8px, -12px, 90px) rotateZ(1.8deg); }
    }

    .project-panel {
      position: relative;
      align-self: end;
      padding-bottom: 2px;
      pointer-events: auto;
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .kicker::before {
      content: "";
      width: 42px;
      height: 1px;
      background: currentColor;
    }

    .current-title {
      margin: 14px 0 0;
      font-family: var(--title-font);
      font-size: clamp(34px, 4.2vw, 72px);
      line-height: .94;
      font-weight: 500;
      letter-spacing: 0;
    }

    .current-desc {
      margin: 14px 0 0;
      color: var(--soft);
      font-family: var(--title-font);
      font-size: 17px;
      line-height: 1.72;
      text-wrap: pretty;
    }

    .keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .keyword {
      position: relative;
      min-height: 31px;
      padding: 0 9px;
      border: 1px solid rgba(244,234,217,.16);
      color: rgba(244,234,217,.66);
      background: rgba(0,0,0,.14);
      overflow: hidden;
      transition: color .2s ease, border-color .2s ease, transform .24s cubic-bezier(.16, 1, .3, 1), background .2s ease;
    }

    .keyword::before {
      content: "";
      position: absolute;
      inset: 0;
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      transform: translateY(101%);
      transition: transform .26s cubic-bezier(.16, 1, .3, 1);
    }

    .keyword span {
      position: relative;
      z-index: 1;
    }

    .keyword:hover,
    .keyword.is-active {
      color: #fff;
      border-color: rgba(244,234,217,.5);
      transform: translateY(-3px);
      background: rgba(244,234,217,.05);
    }

    .keyword:hover::before,
    .keyword.is-active::before {
      transform: translateY(0);
    }

    .time-belt {
      grid-column: 1 / -1;
      grid-row: 3;
      position: relative;
      overflow: hidden;
      pointer-events: auto;
      mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
    }

    .belt-track {
      position: absolute;
      inset: 0;
      display: flex;
      gap: 12px;
      width: max-content;
      animation: timeFlow 28s linear infinite;
      will-change: transform;
    }

    .time-belt:hover .belt-track {
      animation-play-state: paused;
    }

    @keyframes timeFlow {
      to { transform: translateX(calc(-50% - 6px)); }
    }

    .frame {
      position: relative;
      flex: 0 0 clamp(180px, 18vw, 320px);
      height: 100%;
      overflow: hidden;
      border: 1px solid rgba(244,234,217,.13);
      opacity: .5;
      clip-path: inset(18% 0);
      background: #090807;
      transform: translateY(12px) rotateZ(-.6deg);
      transition: opacity .24s ease, clip-path .32s cubic-bezier(.16, 1, .3, 1), transform .32s cubic-bezier(.16, 1, .3, 1), border-color .2s ease;
      animation: frameFloat 4.8s ease-in-out infinite;
    }

    .frame:nth-child(2n) {
      transform: translateY(2px) rotateZ(.8deg);
      animation-delay: -1.4s;
    }

    .frame:nth-child(3n) {
      animation-delay: -2.5s;
    }

    @keyframes frameFloat {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -8px; }
    }

    .frame:hover,
    .frame.is-active {
      opacity: 1;
      clip-path: inset(0);
      transform: translateY(-5px) rotateZ(0deg) scale(1.025);
      border-color: color-mix(in srgb, var(--accent) 62%, white);
    }

    .thumb {
      position: absolute;
      inset: 0;
      background: var(--fallback);
      transition: transform .52s cubic-bezier(.16, 1, .3, 1), filter .24s ease;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .frame:hover .thumb,
    .frame.is-active .thumb {
      transform: scale(1.08);
      filter: saturate(1.08);
    }

    .frame strong {
      position: absolute;
      left: 10px;
      bottom: 8px;
      z-index: 2;
      color: rgba(244,234,217,.9);
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 400;
      text-transform: uppercase;
      text-shadow: 0 3px 14px rgba(0,0,0,.86);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .frame:hover strong,
    .frame.is-active strong {
      opacity: 1;
      transform: translateY(0);
    }

    .chapter-strip {
      position: fixed;
      left: 34px;
      right: 34px;
      bottom: 30px;
      z-index: 45;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 22px;
      align-items: end;
      opacity: 0;
      pointer-events: none;
      transform: translateY(16px);
      transition: opacity .26s ease, transform .32s cubic-bezier(.16, 1, .3, 1);
    }

    .page.has-keyword .chapter-strip {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .chapter-title {
      font-family: var(--title-font);
      font-size: clamp(30px, 4vw, 66px);
      line-height: .95;
      font-weight: 500;
    }

    .chapter-copy {
      max-width: 680px;
      margin-top: 10px;
      color: var(--soft);
      font-size: 13px;
      line-height: 1.7;
    }

    .detail {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      grid-template-rows: 78px 1fr;
      padding: 28px 34px 34px;
      background: rgba(3,3,3,.86);
      backdrop-filter: blur(18px);
      opacity: 0;
      pointer-events: none;
      transform: translateY(18px);
      transition: opacity .32s ease, transform .42s cubic-bezier(.16, 1, .3, 1);
    }

    .page.is-detail .detail {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .detail-top {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 24px;
    }

    .close {
      height: 36px;
      padding: 0 13px;
      border: 1px solid rgba(244,234,217,.22);
      color: var(--soft);
      background: rgba(0,0,0,.18);
    }

    .close:hover {
      color: #fff;
      border-color: rgba(244,234,217,.58);
      transform: translateY(-2px);
    }

    .detail-body {
      display: grid;
      grid-template-columns: minmax(0, 58%) minmax(300px, 1fr);
      gap: 30px;
      min-height: 0;
    }

    .detail-image {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(244,234,217,.16);
      background: var(--fallback);
    }

    .detail-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .detail-info {
      align-self: end;
      display: grid;
      gap: 20px;
    }

    .detail-title {
      font-family: var(--title-font);
      font-size: clamp(42px, 5vw, 88px);
      line-height: .92;
      font-weight: 500;
    }

    .detail-copy {
      color: var(--soft);
      font-family: var(--title-font);
      font-size: 18px;
      line-height: 1.72;
    }

    .detail-tabs {
      display: grid;
      grid-template-columns: repeat(4, max-content);
      gap: 9px;
    }

    .tab {
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid rgba(244,234,217,.16);
      transition: color .2s ease, border-color .2s ease, background .2s ease, transform .2s ease;
    }

    .tab:hover,
    .tab.is-active {
      color: #fff;
      border-color: rgba(244,234,217,.5);
      background: rgba(244,234,217,.06);
      transform: translateY(-2px);
    }

    .intro {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      background: #020202;
      pointer-events: none;
      animation: introOut .72s cubic-bezier(.7, 0, .3, 1) 3.4s forwards;
    }

    .intro-word {
      position: absolute;
      left: 34px;
      top: 28px;
      font-family: var(--title-font);
      font-size: clamp(28px, 4vw, 70px);
      opacity: .78;
      animation: introWord 2.5s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .intro-deck {
      position: relative;
      width: min(70vw, 980px);
      height: min(58vh, 560px);
      perspective: 1200px;
    }

    .intro-card {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(28vw, 390px);
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border: 1px solid rgba(244,234,217,.18);
      background: var(--fallback);
      box-shadow: 0 35px 90px rgba(0,0,0,.55);
      transform: translate(-50%, -50%) rotate(0deg) scale(.86);
      animation: cardDeal 3.15s cubic-bezier(.16, 1, .3, 1) forwards;
      animation-delay: var(--delay);
    }

    .intro-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .intro-card:nth-child(1) { --tx: -32vw; --ty: -18vh; --rot: -18deg; --final-x: -21vw; --final-y: -6vh; }
    .intro-card:nth-child(2) { --tx: 26vw; --ty: -12vh; --rot: 16deg; --final-x: -9vw; --final-y: 7vh; }
    .intro-card:nth-child(3) { --tx: -20vw; --ty: 18vh; --rot: 24deg; --final-x: 4vw; --final-y: -9vh; }
    .intro-card:nth-child(4) { --tx: 32vw; --ty: 18vh; --rot: -22deg; --final-x: 16vw; --final-y: 6vh; }
    .intro-card:nth-child(5) { --tx: 0vw; --ty: -26vh; --rot: 9deg; --final-x: 0vw; --final-y: 0vh; }

    @keyframes cardDeal {
      0% { transform: translate(-50%, -50%) rotate(0) scale(.72); opacity: 0; filter: blur(10px); }
      22% { opacity: 1; filter: blur(0); }
      48% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(var(--rot)) scale(.92); }
      76% { transform: translate(calc(-50% + var(--final-x)), calc(-50% + var(--final-y))) rotate(calc(var(--rot) * -.22)) scale(1); }
      100% { transform: translate(-50%, -50%) rotate(0) scale(.18); opacity: 0; }
    }

    @keyframes introWord {
      0% { opacity: 0; transform: translateY(12px); filter: blur(8px); }
      28% { opacity: .84; transform: translateY(0); filter: blur(0); }
      78% { opacity: .84; }
      100% { opacity: 0; transform: translateY(-8px); }
    }

    @keyframes introOut {
      to { opacity: 0; visibility: hidden; }
    }

    .cursor {
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border: 1px solid rgba(244,234,217,.86);
      border-radius: 50%;
      pointer-events: none;
      transform: translate3d(calc(var(--cx, 0) * 1px), calc(var(--cy, 0) * 1px), 0);
      mix-blend-mode: difference;
      transition: width .2s ease, height .2s ease, margin .2s ease, background .2s ease;
    }

    .cursor.is-hot {
      width: 76px;
      height: 76px;
      margin: -38px 0 0 -38px;
      background: rgba(255,255,255,.12);
    }

    .cursor-label {
      position: fixed;
      z-index: 99;
      left: 0;
      top: 0;
      pointer-events: none;
      opacity: 0;
      transform: translate3d(calc(var(--cx, 0) * 1px + 28px), calc(var(--cy, 0) * 1px + 18px), 0);
      color: rgba(244,234,217,.82);
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      transition: opacity .18s ease;
    }

    .cursor-label.is-visible { opacity: 1; }

    .drop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.68);
      backdrop-filter: blur(18px);
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .page.is-dragging .drop { opacity: 1; }

    .drop strong {
      display: block;
      font-family: var(--title-font);
      font-size: clamp(42px, 5vw, 82px);
      font-weight: 500;
      text-align: center;
    }

    .drop span {
      display: block;
      margin-top: 14px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      text-align: center;
    }

    @media (max-width: 1080px) {
      html, body { overflow: auto; cursor: auto; }
      .page { height: auto; min-height: 100vh; }
      .shell {
        min-height: 100vh;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto auto;
        padding: 22px;
      }
      .topbar { grid-template-columns: 1fr; }
      .status { justify-self: stretch; width: 100%; }
      .tools { justify-self: start; }
      .side, .stage, .time-belt { grid-column: 1; grid-row: auto; }
      .side { gap: 20px; }
      .hero { position: relative; grid-template-columns: 1fr; gap: 18px; }
      .projection { min-height: 58vh; }
      .project-panel { max-width: 720px; }
      .time-belt { height: 108px; }
      .detail-body { grid-template-columns: 1fr; }
      .detail-image { min-height: 46vh; }
      .cursor, .cursor-label { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>

    function glyphs(text) {
      return Array.from(text).map((char) => `<span class="glyph">${char}</span>`).join("");
    }

    function imageMarkup(index, className = "") {
      const work = works[index];
      const style = `--fallback:${work.fallback}`;
      if (!urls[index]) return `<div class="${className}" style="${style}"></div>`;
      return `<div class="${className}" style="${style}"><img src="${urls[index]}" alt="${work.cn}"></div>`;
    }

    function setImage(el, index, className) {
      el.outerHTML = imageMarkup(index, className);
      return document.querySelector(`.${className}`);
    }

    function renderIntro() {
      introDeck.innerHTML = "";
      works.forEach((work, index) => {
        const card = document.createElement("div");
        card.className = "intro-card";
        card.style.setProperty("--fallback", work.fallback);
        card.style.setProperty("--delay", `${index * .08}s`);
        if (urls[index]) card.innerHTML = `<img src="${urls[index]}" alt="${work.cn}">`;
        introDeck.appendChild(card);
      });
    }

    function renderWorkList() {
      workList.innerHTML = "";
      works.forEach((work, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `work-button touch${index === active ? " is-active" : ""}`;
        button.innerHTML = `
          <span class="work-index">${String(index + 1).padStart(2, "0")}</span>
          <span>
            <span class="work-title">${glyphs(work.cn)}</span>
            <span class="work-en">${work.en}</span>
          </span>
        `;
        button.addEventListener("pointerenter", () => setActive(index, false));
        button.addEventListener("click", () => setActive(index, true));
        workList.appendChild(button);
      });
    }

    function renderBelt() {
      beltTrack.innerHTML = "";
      [...works, ...works].forEach((work, rawIndex) => {
        const index = rawIndex % works.length;
        const frame = document.createElement("button");
        frame.type = "button";
        frame.className = `frame touch${index === active ? " is-active" : ""}`;
        frame.innerHTML = `${imageMarkup(index, "thumb")}<strong>${String(index + 1).padStart(2, "0")} ${work.en}</strong>`;
        frame.addEventListener("pointerenter", () => setActive(index, false));
        frame.addEventListener("click", () => setActive(index, true));
        beltTrack.appendChild(frame);
      });
    }

    function renderKeywords() {
      keywords.innerHTML = "";
      works[active].tags.forEach(([tag, copy]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `keyword touch${activeKeyword === tag ? " is-active" : ""}`;
        button.innerHTML = `<span>${tag}</span>`;
        button.addEventListener("pointerenter", () => {
          statusLineText.textContent = `keyword preview / ${tag}`;
        });
        button.addEventListener("click", () => {
          activeKeyword = tag;
          chapterTitle.textContent = tag;
          chapterCopy.textContent = copy;
          statusLineText.textContent = `/work/${works[active].id}#${tag}`;

          projection.classList.add("is-switching");
          setTimeout(() => projection.classList.remove("is-switching"), 780);
          renderKeywords();
        });

      floatB.innerHTML = imageMarkup((active + 2) % works.length, "thumb");
      detailImage.innerHTML = imageMarkup(active, "detail-image-inner");
      imageType.textContent = work.type;
      imageCount.textContent = `${String(active + 1).padStart(2, "0")} / ${String(works.length).padStart(2, "0")}`;
      kicker.textContent = work.kicker;
      currentTitle.textContent = work.cn;
      currentDesc.textContent = work.desc;
      detailBrand.textContent = `作品详情 / ${work.cn}`;
      detailKicker.textContent = work.kicker;
      detailTitle.textContent = work.cn;
      detailCopy.textContent = work.tabs[activeTab];
    }

    function setActive(index, commit) {
      if (active !== index) {
        active = index;
        activeKeyword = null;
        page.classList.remove("has-keyword");
        statusLineText.textContent = `${works[active].en} / time signal selected`;
        renderMain();
        renderWorkList();
        renderBelt();
        renderKeywords();
        projection.classList.add("is-switching");
        setTimeout(() => projection.classList.remove("is-switching"), 780);
      }
      if (commit) openDetail();
    }

    function openDetail() {
      if (didDrag) return;
      statusLineText.textContent = `/work/${works[active].id}`;
      page.classList.add("is-detail");
      projection.classList.add("is-open");
      setTimeout(() => projection.classList.remove("is-open"), 800);
    }

    function closeDetailPanel() {
      page.classList.remove("is-detail");
      statusLineText.textContent = "home / time belt / floating image";
    }

    function setTab(tab) {
      activeTab = tab;
      detailCopy.textContent = works[active].tabs[activeTab];
      detailTabs.querySelectorAll(".tab").forEach((item) => {
        item.classList.toggle("is-active", item.dataset.tab === activeTab);
      });
    }

    function clearKeywordFocus() {
      activeKeyword = null;
      page.classList.remove("has-keyword");
      statusLineText.textContent = `${works[active].en} / image as interface`;
      renderKeywords();
    }

    function loadImages(files) {
      Array.from(files).filter((file) => file.type.startsWith("image/")).slice(0, works.length).forEach((file, index) => {
        if (urls[index]) URL.revokeObjectURL(urls[index]);
        urls[index] = URL.createObjectURL(file);
      });
      renderMain();
      renderBelt();
      renderIntro();
      projection.classList.add("is-switching");
      setTimeout(() => projection.classList.remove("is-switching"), 780);
    }

    function updateTextHover(event) {
      document.querySelectorAll(".touch:hover .glyph, .work-button.is-active .glyph").forEach((glyph, index) => {
        const rect = glyph.getBoundingClientRect();
        const gx = rect.left + rect.width / 2;
        const gy = rect.top + rect.height / 2;
        const dx = event.clientX - gx;
        const dy = event.clientY - gy;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const force = Math.max(0, 1 - distance / 130);
        glyph.style.transform = `translate3d(${(index % 2 ? 3 : -3) * force}px, ${-8 * force}px, 0) skewY(${(index % 2 ? -3 : 3) * force}deg)`;
        glyph.style.opacity = String(.82 + force * .18);
      });
    }

    function resetTextHover() {
      document.querySelectorAll(".glyph").forEach((glyph) => {
        glyph.style.transform = "";
        glyph.style.opacity = "";
      });
    }

    function animatePhysics() {
      if (!physics.down) {
        physics.vx += (0 - physics.x) * .035;
        physics.vy += (0 - physics.y) * .035;
        physics.vx *= .84;
        physics.vy *= .84;
        physics.x += physics.vx;
        physics.y += physics.vy;
      }
      const tiltY = Math.max(-10, Math.min(10, physics.x * .035));
      const tiltX = Math.max(-8, Math.min(8, -physics.y * .03));
      page.style.setProperty("--drag-x", `${physics.x.toFixed(2)}px`);
      page.style.setProperty("--drag-y", `${physics.y.toFixed(2)}px`);
      page.style.setProperty("--tilt-x", `${tiltX.toFixed(2)}deg`);
      page.style.setProperty("--tilt-y", `${tiltY.toFixed(2)}deg`);
      requestAnimationFrame(animatePhysics);
    }

    page.addEventListener("pointermove", (event) => {
      const x = event.clientX / window.innerWidth;
      const y = event.clientY / window.innerHeight;
      page.style.setProperty("--mx", x.toFixed(3));
      page.style.setProperty("--my", y.toFixed(3));
      document.documentElement.style.setProperty("--cx", event.clientX.toFixed(1));
      document.documentElement.style.setProperty("--cy", event.clientY.toFixed(1));
      updateTextHover(event);

      if (physics.down) {
        const dx = event.clientX - physics.lx;
        const dy = event.clientY - physics.ly;
        physics.x += dx;
        physics.y += dy;
        physics.vx = dx;
        physics.vy = dy;
        physics.lx = event.clientX;
        physics.ly = event.clientY;
        if (Math.abs(physics.x) + Math.abs(physics.y) > 8) didDrag = true;
      }
    });

    page.addEventListener("pointerleave", resetTextHover);

    projection.addEventListener("pointerdown", (event) => {
      physics.down = true;
      didDrag = false;
      physics.lx = event.clientX;
      physics.ly = event.clientY;
      projection.setPointerCapture(event.pointerId);
    });

    projection.addEventListener("pointerup", (event) => {
      physics.down = false;
      try { projection.releasePointerCapture(event.pointerId); } catch {}
      setTimeout(() => { didDrag = false; }, 80);
    });

    document.addEventListener("pointerover", (event) => {
      const target = event.target.closest("button, label, .touch");
      cursor.classList.toggle("is-hot", Boolean(target));
      cursorLabel.classList.toggle("is-visible", Boolean(target));
      if (target) cursorLabel.textContent = target.classList.contains("projection") ? "drag / enter" : "touch";
    });

    document.addEventListener("pointerout", (event) => {
      if (!event.relatedTarget || !event.relatedTarget.closest("button, label, .touch")) {
        cursor.classList.remove("is-hot");
        cursorLabel.classList.remove("is-visible");
      }
    });

    projection.addEventListener("click", openDetail);
    detailBtn.addEventListener("click", openDetail);
    closeDetail.addEventListener("click", closeDetailPanel);
    detailHome.addEventListener("click", closeDetailPanel);
    clearKeyword.addEventListener("click", clearKeywordFocus);
    imageInput.addEventListener("change", (event) => loadImages(event.target.files));
    detailTabs.addEventListener("click", (event) => {
      const tab = event.target.closest(".tab");
      if (tab) setTab(tab.dataset.tab);
    });

    ["dragenter", "dragover"].forEach((type) => {
      page.addEventListener(type, (event) => {
        event.preventDefault();
        page.classList.add("is-dragging");
      });
    });

    ["dragleave", "drop"].forEach((type) => {
      page.addEventListener(type, (event) => {
        event.preventDefault();
        page.classList.remove("is-dragging");
      });
    });

    page.addEventListener("drop", (event) => loadImages(event.dataTransfer.files));

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeDetailPanel();
        clearKeywordFocus();
      }
      if (event.key === "ArrowRight" || event.key === "ArrowDown") setActive((active + 1) % works.length, false);
      if (event.key === "ArrowLeft" || event.key === "ArrowUp") setActive((active - 1 + works.length) % works.length, false);
    });

    renderMain();
    renderWorkList();
    renderBelt();
    renderKeywords();
    renderIntro();
    requestAnimationFrame(animatePhysics);
  </script>
</body>
</html>
