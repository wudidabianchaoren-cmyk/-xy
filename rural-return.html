<section id="about" class="project-about" aria-labelledby="aboutTitle"><div class="about-label"><span class="eyebrow">作品简介</span><p>乡土归途<br><span>短片 · 土地与记忆</span></p></div><div class="about-copy"><h2 id="aboutTitle">土地的距离，<br>日常的温度。</h2><p>《乡土归途》围绕山地村落、田野与人的停留组织影像。远山和雾气建立空间的距离，树下的背影与夕照把视线带回日常；环境与人物不再是分开的素材，而是同一段乡土记忆的组成。</p><p>制作从场景与光线的选择开始，再用人物位置、镜头节奏和剪辑衔接保持观看的连贯。影片之后的九幅画面，包含六张独立的乡土元素图与原有三幅画面，呈现远景、环境与人物关系的变化。</p><div class="project-facts"><span>作品形式<small>人工智能影像 / 乡土叙事</small></span><span>视觉线索<small>山地 · 村落 · 田野</small></span><span>展示内容<small>短片与九幅画面</small></span></div></div></section>
