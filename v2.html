<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WuXiangYu - Visual Archive V2</title>
  <style>
    :root {
      color-scheme: dark;
      --paper: #f4ead7;
      --muted: rgba(244, 234, 215, .62);
      --dim: rgba(244, 234, 215, .22);
      --black: #030405;
      --accent: #c48342;
      --danger: #d64031;
      --cyan: #80c7d2;
      --x: .5;
      --y: .5;
      --vx: 0;
      --vy: 0;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020303;
      color: var(--paper);
      cursor: none;
    }

    button,
    label {
      font: inherit;
    }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 720px;
      isolation: isolate;
      background:
        radial-gradient(circle at calc(var(--x) * 100%) calc(var(--y) * 100%), color-mix(in srgb, var(--accent) 32%, transparent), transparent 22%),
        linear-gradient(110deg, #020303, #0e1110 42%, #030607);
    }

    #stageCanvas {
      position: absolute;
      inset: 0;
      z-index: -4;
      width: 100%;
      height: 100%;
      opacity: .96;
    }

    .film-fog {
      position: absolute;
      inset: -18%;
      z-index: -3;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 30%, rgba(255,255,255,.08), transparent 16%),
        radial-gradient(circle at 78% 56%, rgba(255,255,255,.06), transparent 19%),
        repeating-linear-gradient(103deg, transparent 0 18px, rgba(255,255,255,.04) 19px, transparent 22px);
      mix-blend-mode: screen;
      transform: translate3d(calc((var(--x) - .5) * -30px), calc((var(--y) - .5) * -24px), 0);
      opacity: .48;
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      background:
        radial-gradient(circle at calc(var(--x) * 100%) calc(var(--y) * 100%), transparent 0 18%, rgba(0,0,0,.28) 42%, rgba(0,0,0,.82) 100%),
        linear-gradient(90deg, rgba(0,0,0,.82), transparent 18%, transparent 78%, rgba(0,0,0,.7)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 6px);
      mix-blend-mode: multiply;
    }

    .shell {
      position: relative;
      z-index: 3;
      height: 100%;
      padding: clamp(24px, 3.1vw, 46px);
      display: grid;
      grid-template-columns: minmax(310px, 42vw) minmax(280px, 1fr);
      grid-template-rows: auto 1fr auto;
      gap: 24px;
    }

    .mast {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: start;
      gap: 18px;
      pointer-events: none;
    }

    .logo {
      font-family: Georgia, "Times New Roman", "SimSun", serif;
      font-size: clamp(18px, 1.6vw, 28px);
      line-height: .92;
    }

    .logo span {
      display: block;
      margin-top: 9px;
      color: var(--muted);
      font-family: inherit;
      font-size: 10px;
      letter-spacing: .26em;
      text-transform: uppercase;
    }

    .readout {
      justify-self: center;
      width: min(43vw, 620px);
      display: grid;
      grid-template-columns: 84px 1fr 84px;
      align-items: center;
      gap: 12px;
      color: rgba(244,234,215,.65);
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .readout::before,
    .readout::after {
      content: "";
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(244,234,215,.46), transparent);
    }

    .tools {
      justify-self: end;
      display: flex;
      gap: 9px;
      pointer-events: auto;
    }

    .tool {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(244,234,215,.2);
      background: rgba(0,0,0,.18);
      color: rgba(244,234,215,.76);
      backdrop-filter: blur(14px);
      cursor: none;
      transition: border-color 240ms ease, color 240ms ease, background 240ms ease, transform 240ms ease;
    }

    .tool:hover {
      color: #fff;
      border-color: rgba(244,234,215,.52);
      background: rgba(244,234,215,.08);
      transform: translateY(-2px);
    }

    .file {
      display: none;
    }

    .title-list {
      grid-column: 1;
      grid-row: 2;
      align-self: center;
      display: grid;
      gap: clamp(2px, .5vw, 8px);
      pointer-events: auto;
    }

    .work-row {
      position: relative;
      border: 0;
      padding: 0;
      background: transparent;
      color: rgba(244,234,215,.38);
      text-align: left;
      cursor: none;
      display: grid;
      grid-template-columns: 46px 1fr;
      align-items: baseline;
      gap: clamp(12px, 1.5vw, 22px);
      transform: translateX(calc((var(--x) - .5) * -16px));
      transition: color 360ms ease, transform 360ms cubic-bezier(.16, 1, .3, 1), filter 360ms ease;
    }

    .work-row::before {
      content: "";
      position: absolute;
      left: 46px;
      right: 0;
      bottom: 8%;
      height: 1px;
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 82%, white), transparent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 440ms cubic-bezier(.16, 1, .3, 1);
    }

    .work-row .num {
      color: rgba(244,234,215,.36);
      font-size: 11px;
      letter-spacing: .22em;
      transition: color 300ms ease;
    }

    .work-row .name {
      font-family: Georgia, "Times New Roman", "SimSun", serif;
      font-size: clamp(42px, 6.8vw, 116px);
      line-height: .86;
      font-weight: 500;
      letter-spacing: -.01em;
    }

    .work-row .en {
      display: block;
      margin-top: 8px;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      font-size: clamp(10px, .85vw, 13px);
      line-height: 1.3;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(244,234,215,.4);
      transition: color 300ms ease, transform 300ms ease;
    }

    .work-row:hover,
    .work-row.is-active {
      color: rgba(244,234,215,.96);
      filter: drop-shadow(0 22px 46px rgba(0,0,0,.34));
      transform: translateX(calc(18px + (var(--x) - .5) * -22px));
    }

    .work-row:hover::before,
    .work-row.is-active::before {
      transform: scaleX(1);
    }

    .work-row:hover .num,
    .work-row.is-active .num {
      color: var(--accent);
    }

    .work-row:hover .en,
    .work-row.is-active .en {
      color: rgba(244,234,215,.72);
      transform: translateX(8px);
    }

    .right-space {
      grid-column: 2;
      grid-row: 2;
      position: relative;
      min-height: 460px;
      pointer-events: none;
    }

    .floating-preview {
      position: absolute;
      width: min(38vw, 560px);
      aspect-ratio: 16 / 9;
      left: 9%;
      top: 18%;
      overflow: hidden;
      border: 1px solid rgba(244,234,215,.18);
      box-shadow: 0 42px 120px rgba(0,0,0,.54);
      transform:
        translate3d(calc((var(--x) - .5) * 52px), calc((var(--y) - .5) * 38px), 0)
        rotateX(calc((var(--y) - .5) * -7deg))
        rotateY(calc((var(--x) - .5) * 8deg));
      transform-style: preserve-3d;
      transition: clip-path 680ms cubic-bezier(.16, 1, .3, 1), opacity 340ms ease;
      clip-path: inset(6% 10% 6% 10%);
      opacity: .92;
    }

    .floating-preview.is-pulse {
      animation: pulseFrame 680ms cubic-bezier(.16, 1, .3, 1);
    }

    @keyframes pulseFrame {
      0% { clip-path: inset(42% 49% 42% 49%); filter: blur(8px); }
      100% { clip-path: inset(6% 10% 6% 10%); filter: blur(0); }
    }

    .scene,
    .thumb-scene,
    .cursor-preview {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 44%, rgba(255,255,255,.1), transparent 12%),
        var(--scene);
    }

    .scene img,
    .thumb-scene img,
    .cursor-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .scene::after,
    .thumb-scene::after,
    .cursor-preview::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at calc(var(--x) * 100%) calc(var(--y) * 100%), transparent 0 21%, rgba(0,0,0,.38) 66%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px 7px);
      mix-blend-mode: multiply;
    }

    .rural {
      --scene:
        linear-gradient(180deg, #d8a45b 0%, #ba7740 40%, #3c2719 74%, #110c08 100%);
    }

    .palace {
      --scene:
        radial-gradient(circle at 50% 44%, rgba(255,196,86,.4), transparent 18%),
        linear-gradient(180deg, #35170e, #815023 48%, #1f261b);
    }

    .rain {
      --scene:
        repeating-linear-gradient(104deg, rgba(235,255,255,.26) 0 1px, transparent 1px 7px),
        linear-gradient(180deg, #a8dce4, #547f8c 48%, #051e28);
    }

    .abyss {
      --scene:
        radial-gradient(ellipse at 24% 48%, rgba(0,0,0,.9) 0 12%, transparent 13%),
        linear-gradient(180deg, #263132, #111819 48%, #020303);
    }

    .folk {
      --scene:
        radial-gradient(circle at 34% 38%, rgba(207,82,27,.72), transparent 16%),
        linear-gradient(180deg, #0d464c, #06272c 48%, #030707);
    }

    .preview-label {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 16px;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      color: rgba(244,234,215,.82);
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      text-shadow: 0 3px 18px rgba(0,0,0,.8);
    }

    .meta-card {
      position: absolute;
      right: clamp(8px, 4vw, 80px);
      bottom: 18%;
      width: min(31vw, 420px);
      pointer-events: auto;
      color: rgba(244,234,215,.74);
      transform: translate3d(calc((var(--x) - .5) * -30px), calc((var(--y) - .5) * -20px), 0);
    }

    .meta-card .kicker {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .meta-card .kicker::before {
      content: "";
      width: 40px;
      height: 1px;
      background: currentColor;
    }

    .meta-card p {
      margin: 16px 0 0;
      font-size: clamp(14px, 1.15vw, 17px);
      line-height: 1.78;
      text-wrap: pretty;
    }

    .tag-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .tag-cloud span {
      border: 1px solid rgba(244,234,215,.18);
      color: rgba(244,234,215,.72);
      padding: 6px 8px;
      font-size: 11px;
      letter-spacing: .08em;
      background: rgba(0,0,0,.16);
      backdrop-filter: blur(10px);
      transition: transform 260ms ease, border-color 260ms ease, color 260ms ease;
    }

    .tag-cloud span:hover {
      transform: translateY(-2px);
      color: #fff;
      border-color: rgba(244,234,215,.52);
    }

    .strip {
      grid-column: 1 / -1;
      grid-row: 3;
      position: relative;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      height: clamp(76px, 10vh, 112px);
      pointer-events: auto;
    }

    .strip button {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(244,234,215,.16);
      background: rgba(255,255,255,.04);
      cursor: none;
      opacity: .46;
      transform: translateY(18px);
      transition:
        opacity 320ms ease,
        transform 420ms cubic-bezier(.16, 1, .3, 1),
        border-color 320ms ease,
        clip-path 420ms cubic-bezier(.16, 1, .3, 1);
      clip-path: inset(18% 0 18% 0);
    }

    .strip button:nth-child(2n) {
      transform: translateY(4px);
    }

    .strip button:hover,
    .strip button.is-active {
      opacity: 1;
      border-color: color-mix(in srgb, var(--accent) 70%, white);
      transform: translateY(-4px);
      clip-path: inset(0 0 0 0);
    }

    .strip .thumb-scene {
      transition: transform 640ms cubic-bezier(.16, 1, .3, 1), filter 360ms ease;
    }

    .strip button:hover .thumb-scene,
    .strip button.is-active .thumb-scene {
      transform: scale(1.08);
      filter: saturate(1.12) contrast(1.04);
    }

    .reactive-zones {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .zone {
      position: absolute;
      border: 1px solid rgba(244,234,215,.1);
      opacity: 0;
      background: rgba(255,255,255,.018);
      backdrop-filter: blur(1px);
      transition: opacity 280ms ease, transform 380ms cubic-bezier(.16, 1, .3, 1);
    }

    .zone.is-hot {
      opacity: 1;
      transform: scale(1.018);
    }

    .zone-a {
      width: 18vw;
      height: 24vh;
      right: 34vw;
      top: 19vh;
    }

    .zone-b {
      width: 24vw;
      height: 18vh;
      right: 5vw;
      top: 32vh;
    }

    .zone-c {
      width: 20vw;
      height: 22vh;
      right: 22vw;
      bottom: 18vh;
    }

    .cursor {
      position: fixed;
      z-index: 100;
      left: 0;
      top: 0;
      width: 18px;
      height: 18px;
      margin: -9px 0 0 -9px;
      border: 1px solid rgba(244,234,215,.78);
      border-radius: 50%;
      pointer-events: none;
      transform: translate3d(calc(var(--client-x, 50) * 1px), calc(var(--client-y, 50) * 1px), 0);
      transition: width 260ms ease, height 260ms ease, margin 260ms ease, border-color 260ms ease, background 260ms ease;
      mix-blend-mode: difference;
    }

    .cursor.is-hovering {
      width: 74px;
      height: 74px;
      margin: -37px 0 0 -37px;
      background: rgba(255,255,255,.12);
      border-color: #fff;
    }

    .cursor-card {
      position: fixed;
      z-index: 99;
      left: 0;
      top: 0;
      width: 220px;
      aspect-ratio: 16 / 10;
      pointer-events: none;
      overflow: hidden;
      border: 1px solid rgba(244,234,215,.26);
      box-shadow: 0 22px 68px rgba(0,0,0,.52);
      transform:
        translate3d(calc(var(--client-x, 50) * 1px + 26px), calc(var(--client-y, 50) * 1px + 22px), 0)
        rotate(calc(var(--vx) * 1.8deg));
      opacity: 0;
      clip-path: inset(50% 50% 50% 50%);
      transition: opacity 220ms ease, clip-path 360ms cubic-bezier(.16, 1, .3, 1);
    }

    .cursor-card.is-visible {
      opacity: 1;
      clip-path: inset(0 0 0 0);
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: grid;
      place-items: center;
      background: #020303;
      animation: leave 900ms cubic-bezier(.7, 0, .3, 1) 1400ms forwards;
    }

    .loader-inner {
      width: min(560px, 76vw);
      color: rgba(244,234,215,.82);
      font-size: 11px;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .loader-bar {
      position: relative;
      height: 1px;
      margin-top: 18px;
      background: rgba(244,234,215,.16);
      overflow: hidden;
    }

    .loader-bar::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      background: var(--accent);
      transform-origin: left;
      animation: load 1250ms cubic-bezier(.16, 1, .3, 1) forwards;
    }

    @keyframes load {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @keyframes leave {
      to { opacity: 0; visibility: hidden; pointer-events: none; }
    }

    .drop {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,.62);
      backdrop-filter: blur(18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .app.is-dragging .drop {
      opacity: 1;
    }

    .drop strong {
      display: block;
      font-family: Georgia, "Times New Roman", "SimSun", serif;
      font-weight: 500;
      font-size: clamp(36px, 5vw, 84px);
    }

    .drop span {
      display: block;
      margin-top: 14px;
      color: var(--muted);
      text-align: center;
      letter-spacing: .16em;
      font-size: 12px;
      text-transform: uppercase;
    }

    @media (max-width: 980px) {
      html,
      body {
        overflow: auto;
        cursor: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
      }

      .shell {
        min-height: 100vh;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto auto;
        padding: 22px;
      }

      .mast {
        grid-template-columns: 1fr;
      }

      .readout {
        justify-self: stretch;
        width: 100%;
      }

      .tools {
        justify-self: start;
      }

      .title-list,
      .right-space,
      .strip {
        grid-column: 1;
        grid-row: auto;
      }

      .work-row .name {
        font-size: clamp(40px, 15vw, 78px);
      }

      .right-space {
        min-height: 620px;
      }

      .floating-preview {
        width: 86vw;
        left: 2vw;
        top: 34px;
      }

      .meta-card {
        width: auto;
        left: 2vw;
        right: 2vw;
        bottom: 58px;
      }

      .strip {
        grid-template-columns: 1fr;
        height: auto;
      }

      .strip button {
        height: 92px;
      }

      .cursor,
      .cursor-card {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <canvas id="stageCanvas" aria-hidden="true"></canvas>
    <div class="film-fog"></div>
    <div class="reactive-zones" aria-hidden="true">
      <div class="zone zone-a"></div>
      <div class="zone zone-b"></div>
      <div class="zone zone-c"></div>
    </div>
    <div class="vignette"></div>

    <section class="shell">
      <header class="mast">
        <div class="logo">WuXiangYu<span>AI image worlds / visual archive</span></div>
        <div class="readout"><span id="readout">hover any title to tune the archive</span></div>
        <div class="tools">
          <button class="tool" id="scramble" type="button">扰动</button>
          <label class="tool" for="loaderInput">载入剧照</label>
          <input class="file" id="loaderInput" type="file" accept="image/*" multiple>
        </div>
      </header>

      <nav class="title-list" id="titleList" aria-label="works"></nav>

      <aside class="right-space">
        <div class="floating-preview" id="floatingPreview">
          <div class="scene rural" id="previewScene"></div>
          <div class="preview-label">
            <span id="previewType">AI Short Film</span>
            <span id="previewIndex">01 / 05</span>
          </div>
        </div>

        <article class="meta-card">
          <div class="kicker" id="kicker">memory field</div>
          <p id="desc">黄昏、背影、土地和远处的路。让作品先以气氛和空间击中人，文字退到字幕的位置。</p>
          <div class="tag-cloud" id="tags"></div>
        </article>
      </aside>

      <div class="strip" id="strip"></div>
    </section>

    <div class="drop">
      <div>
        <strong>放入你的 AI 剧照</strong>
        <span>拖入 5 张图后，这套交互会直接套用到真实作品</span>
      </div>
    </div>
  </main>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-card" id="cursorCard"></div>

  <div class="loader">
    <div class="loader-inner">
      visual archive calibration
      <div class="loader-bar"></div>
    </div>
  </div>

  <script>
    const works = [
      {
        id: "rural",
        cn: "回不去的乡",
        en: "Distant Homeland",
        type: "AI Short Film",
        kicker: "memory field",
        desc: "黄昏、背影、土地和远处的路。让作品先以气氛和空间击中人，文字退到字幕的位置。",
        tags: ["乡土记忆", "黄昏", "背影", "时代残影"],
        accent: "#c48342"
      },
      {
        id: "palace",
        cn: "东方玄幻",
        en: "Oriental Fantasy Demo",
        type: "Scene Design",
        kicker: "court drama",
        desc: "宫殿、红衣、对峙和人物设定。主剧照作为戏剧中心，设定图像变成可触发的影像抽屉。",
        tags: ["宫殿", "人物设定", "对峙", "古典张力"],
        accent: "#cc2f24"
      },
      {
        id: "rain",
        cn: "雨夜与红",
        en: "Wet Oriental Classicism",
        type: "Color Study",
        kicker: "rain and red",
        desc: "蓝灰雨幕、红灯笼、湿地反射。它不是说明页，而是一组能被鼠标调亮的气氛研究。",
        tags: ["冷光", "红色焦点", "雨幕", "湿地反射"],
        accent: "#87c8d2"
      },
      {
        id: "abyss",
        cn: "骸骨之岸",
        en: "Echoes of the Abyss",
        type: "Film Concept",
        kicker: "black sea",
        desc: "黑海、白瞳、骨骸岛和低饱和灾难史诗。滚动和悬停应该像剪辑台，不像图片列表。",
        tags: ["深海", "白瞳", "骨骸岛", "低饱和"],
        accent: "#9eb7b2"
      },
      {
        id: "folk",
        cn: "民俗符号",
        en: "Northeast Ritual System",
        type: "Symbol Archive",
        kicker: "ritual objects",
        desc: "祭祀、器物、烟、布料和地域信仰。这里应是符号标本室，每个物件一触即亮。",
        tags: ["祭祀", "器物", "烟", "民间信仰"],
        accent: "#d88b1d"
      }
    ];

    const app = document.querySelector("#app");
    const canvas = document.querySelector("#stageCanvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const titleList = document.querySelector("#titleList");
    const strip = document.querySelector("#strip");
    const cursor = document.querySelector("#cursor");
    const cursorCard = document.querySelector("#cursorCard");
    const previewScene = document.querySelector("#previewScene");
    const floatingPreview = document.querySelector("#floatingPreview");
    const previewType = document.querySelector("#previewType");
    const previewIndex = document.querySelector("#previewIndex");
    const kicker = document.querySelector("#kicker");
    const desc = document.querySelector("#desc");
    const tags = document.querySelector("#tags");
    const readout = document.querySelector("#readout");
    const loaderInput = document.querySelector("#loaderInput");
    const scramble = document.querySelector("#scramble");
    const zones = Array.from(document.querySelectorAll(".zone"));

    let width = 1;
    let height = 1;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let active = 0;
    let target = 0;
    let mouse = { x: .55, y: .46, px: .55, py: .46, vx: 0, vy: 0, down: false };
    let pulse = 0;
    let imageUrls = new Array(works.length).fill("");
    let images = new Array(works.length).fill(null);

    function setSize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function makeScene(workIndex, className) {
      const work = works[workIndex];
      const el = document.createElement("div");
      el.className = `${className} ${work.id}`;
      if (imageUrls[workIndex]) {
        const img = document.createElement("img");
        img.src = imageUrls[workIndex];
        img.alt = work.cn;
        el.appendChild(img);
      }
      return el;
    }

    function renderNavigation() {
      titleList.innerHTML = "";
      strip.innerHTML = "";

      works.forEach((work, index) => {
        const row = document.createElement("button");
        row.type = "button";
        row.className = `work-row${index === active ? " is-active" : ""}`;
        row.innerHTML = `<span class="num">${String(index + 1).padStart(2, "0")}</span><span><span class="name">${work.cn}</span><span class="en">${work.en}</span></span>`;
        row.addEventListener("pointerenter", () => activate(index, true));
        row.addEventListener("focus", () => activate(index, true));
        row.addEventListener("click", () => burst(index));
        titleList.appendChild(row);

        const item = document.createElement("button");
        item.type = "button";
        item.className = index === active ? "is-active" : "";
        item.appendChild(makeScene(index, "thumb-scene"));
        item.addEventListener("pointerenter", () => activate(index, true));
        item.addEventListener("click", () => burst(index));
        strip.appendChild(item);
      });
    }

    function renderCursorCard() {
      cursorCard.innerHTML = "";
      cursorCard.appendChild(makeScene(active, "cursor-preview"));
    }

    function renderPreview() {
      const next = makeScene(active, "scene");
      next.id = "previewScene";
      document.querySelector("#previewScene").replaceWith(next);
      previewType.textContent = works[active].type;
      previewIndex.textContent = `${String(active + 1).padStart(2, "0")} / ${String(works.length).padStart(2, "0")}`;
      kicker.textContent = works[active].kicker;
      desc.textContent = works[active].desc;
      tags.innerHTML = "";
      works[active].tags.forEach((tag) => {
        const span = document.createElement("span");
        span.textContent = tag;
        tags.appendChild(span);
      });
      app.style.setProperty("--accent", works[active].accent);
      readout.textContent = `${works[active].en} / hover-reactive visual system`;
      floatingPreview.classList.remove("is-pulse");
      void floatingPreview.offsetWidth;
      floatingPreview.classList.add("is-pulse");
      renderCursorCard();
      renderNavigation();
    }

    function activate(index, fromHover = false) {
      target = index;
      if (active !== index) {
        active = index;
        pulse = fromHover ? 1 : .6;
        renderPreview();
      }
    }

    function burst(index) {
      activate(index, false);
      pulse = 1.8;
      zones.forEach((zone, zoneIndex) => {
        zone.classList.add("is-hot");
        window.setTimeout(() => zone.classList.remove("is-hot"), 360 + zoneIndex * 120);
      });
    }

    function loadFiles(files) {
      Array.from(files).filter((file) => file.type.startsWith("image/")).slice(0, works.length).forEach((file, index) => {
        if (imageUrls[index]) URL.revokeObjectURL(imageUrls[index]);
        const url = URL.createObjectURL(file);
        imageUrls[index] = url;
        const img = new Image();
        img.src = url;
        images[index] = img;
      });
      renderPreview();
      pulse = 1.4;
    }

    function drawPlaceholder(work, time) {
      const gradient = ctx.createLinearGradient(0, 0, width, height);
      const mx = mouse.x - .5;
      const my = mouse.y - .5;

      if (work.id === "rural") {
        gradient.addColorStop(0, "#1b0f09");
        gradient.addColorStop(.42, "#c08344");
        gradient.addColorStop(1, "#080807");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "rgba(12,8,4,.82)";
        ctx.fillRect(0, 0, width * .18 + mx * 80, height);
        ctx.fillStyle = "rgba(9,11,14,.78)";
        ctx.beginPath();
        ctx.ellipse(width * .62, height * .58, width * .035, height * .11, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(70,42,22,.34)";
        for (let i = 0; i < 90; i++) ctx.fillRect((i * 97 + time * 12) % width, height * (.61 + (i % 9) * .022), 110, 1);
      }

      if (work.id === "palace") {
        gradient.addColorStop(0, "#210d08");
        gradient.addColorStop(.52, "#89511f");
        gradient.addColorStop(1, "#12170f");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "rgba(255,196,88,.16)";
        for (let i = 0; i < 9; i++) ctx.fillRect(width * (.18 + i * .08 + mx * .018), 0, 10, height);
        ctx.fillStyle = "rgba(166,16,19,.74)";
        ctx.fillRect(width * .39, height * .38, width * .07, height * .38);
        ctx.fillStyle = "rgba(3,5,7,.78)";
        ctx.fillRect(width * .58, height * .38, width * .06, height * .38);
      }

      if (work.id === "rain") {
        gradient.addColorStop(0, "#b9e2e7");
        gradient.addColorStop(.5, "#557f89");
        gradient.addColorStop(1, "#031721");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
        ctx.strokeStyle = "rgba(230,255,255,.28)";
        ctx.lineWidth = 1;
        for (let i = 0; i < 150; i++) {
          const x = (i * 31 + time * 240) % (width + 100) - 50;
          ctx.beginPath();
          ctx.moveTo(x, -10);
          ctx.lineTo(x - 80, height + 10);
          ctx.stroke();
        }
        ctx.fillStyle = "rgba(216,38,31,.76)";
        for (let i = 0; i < 7; i++) {
          ctx.beginPath();
          ctx.arc(width * (.62 + i * .044), height * (.42 + Math.sin(i) * .04), 18, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (work.id === "abyss") {
        gradient.addColorStop(0, "#2b3435");
        gradient.addColorStop(.48, "#111819");
        gradient.addColorStop(1, "#010202");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "rgba(0,0,0,.78)";
        ctx.beginPath();
        ctx.ellipse(width * .26, height * .49, width * .2, height * .29, -.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(150,181,180,.15)";
        for (let i = 0; i < 48; i++) {
          ctx.beginPath();
          ctx.moveTo(width * .5 + i * 18, 0);
          ctx.lineTo(width * .38 + i * 12, height);
          ctx.stroke();
        }
      }

      if (work.id === "folk") {
        gradient.addColorStop(0, "#0f4b50");
        gradient.addColorStop(.46, "#062a2f");
        gradient.addColorStop(1, "#030707");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "rgba(213,88,28,.62)";
        ctx.beginPath();
        ctx.ellipse(width * .31, height * .4, width * .14, height * .09, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(232,226,205,.14)";
        for (let i = 0; i < 22; i++) {
          ctx.beginPath();
          ctx.arc(width * (.62 + Math.sin(i) * .08), height * (.5 + Math.cos(i * 1.2) * .12), 40 + i * 7, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    function drawImageWithDisplacement(img, time) {
      const iw = img.naturalWidth || img.width;
      const ih = img.naturalHeight || img.height;
      if (!iw || !ih) return false;
      const scale = Math.max(width / iw, height / ih) * (1.03 + pulse * .015);
      const sw = width / scale;
      const sh = height / scale;
      const sx = (iw - sw) * (.5 + (mouse.x - .5) * .035);
      const sy = (ih - sh) * (.5 + (mouse.y - .5) * .035);
      const strips = 34;
      const stripH = height / strips;
      for (let i = 0; i < strips; i++) {
        const y = i * stripH;
        const dist = Math.abs(y / height - mouse.y);
        const warp = Math.max(0, .22 - dist) * 90 * (mouse.vx + pulse * .08);
        ctx.drawImage(img, sx, sy + (sh / strips) * i, sw, sh / strips + 1, warp, y, width, stripH + 1);
      }
      return true;
    }

    function drawOverlay(time) {
      const cx = mouse.x * width;
      const cy = mouse.y * height;
      const radial = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(width, height) * (.24 + pulse * .035));
      radial.addColorStop(0, "rgba(255,255,255,.12)");
      radial.addColorStop(.34, "rgba(255,255,255,.035)");
      radial.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = radial;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = "rgba(0,0,0,.18)";
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = "rgba(244,234,215,.055)";
      ctx.lineWidth = 1;
      for (let i = 0; i < 34; i++) {
        const y = (i * 37 + time * 18) % height;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y + mouse.vy * 26);
        ctx.stroke();
      }

      if (pulse > .05) {
        ctx.strokeStyle = `rgba(244,234,215,${Math.min(.55, pulse * .35)})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, 80 + pulse * 220, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function tick(timeMs) {
      const time = timeMs / 1000;
      mouse.vx += (mouse.x - mouse.px - mouse.vx) * .12;
      mouse.vy += (mouse.y - mouse.py - mouse.vy) * .12;
      mouse.px += (mouse.x - mouse.px) * .18;
      mouse.py += (mouse.y - mouse.py) * .18;
      app.style.setProperty("--vx", mouse.vx.toFixed(3));
      app.style.setProperty("--vy", mouse.vy.toFixed(3));

      const work = works[active];
      const img = images[active];
      ctx.clearRect(0, 0, width, height);
      if (!img || !drawImageWithDisplacement(img, time)) drawPlaceholder(work, time);
      drawOverlay(time);
      pulse *= .92;
      requestAnimationFrame(tick);
    }

    app.addEventListener("pointermove", (event) => {
      mouse.x = event.clientX / width;
      mouse.y = event.clientY / height;
      app.style.setProperty("--x", mouse.x.toFixed(3));
      app.style.setProperty("--y", mouse.y.toFixed(3));
      document.documentElement.style.setProperty("--client-x", event.clientX.toFixed(1));
      document.documentElement.style.setProperty("--client-y", event.clientY.toFixed(1));

      zones.forEach((zone) => {
        const rect = zone.getBoundingClientRect();
        const hot = event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
        zone.classList.toggle("is-hot", hot);
        if (hot) pulse = Math.max(pulse, .28);
      });
    });

    app.addEventListener("pointerdown", () => {
      mouse.down = true;
      pulse = 1.1;
    });

    app.addEventListener("pointerup", () => {
      mouse.down = false;
    });

    document.addEventListener("pointerover", (event) => {
      const interactive = event.target.closest("button, label, .tag-cloud span");
      cursor.classList.toggle("is-hovering", Boolean(interactive));
      cursorCard.classList.toggle("is-visible", Boolean(event.target.closest(".work-row, .strip button")));
    });

    document.addEventListener("pointerout", (event) => {
      if (!event.relatedTarget || !event.relatedTarget.closest("button, label, .tag-cloud span")) {
        cursor.classList.remove("is-hovering");
      }
      if (!event.relatedTarget || !event.relatedTarget.closest(".work-row, .strip button")) {
        cursorCard.classList.remove("is-visible");
      }
    });

    loaderInput.addEventListener("change", (event) => loadFiles(event.target.files));

    ["dragenter", "dragover"].forEach((type) => {
      app.addEventListener(type, (event) => {
        event.preventDefault();
        app.classList.add("is-dragging");
      });
    });

    ["dragleave", "drop"].forEach((type) => {
      app.addEventListener(type, (event) => {
        event.preventDefault();
        app.classList.remove("is-dragging");
      });
    });

    app.addEventListener("drop", (event) => loadFiles(event.dataTransfer.files));

    scramble.addEventListener("click", () => {
      burst((active + 1) % works.length);
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowDown" || event.key === "ArrowRight") burst((active + 1) % works.length);
      if (event.key === "ArrowUp" || event.key === "ArrowLeft") burst((active - 1 + works.length) % works.length);
    });

    window.addEventListener("resize", setSize);
    setSize();
    renderPreview();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
